[package]
name = "todo-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# Microsoft's mssql-tds driver (the mssql-rs repository) behind a small tiberius-style API
# with connection pooling.
mssql-tiberius-bridge = "0.3"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.12.0", default-features = false, features = ["asset", "cookie", "discover", "font-fontsource", "icon-iconify", "mail", "mail-smtp", "router", "runtime", "serve", "session", "tailwind", "ui", "view"] }
argon2 = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
topcoat = { version = "0.12.0", default-features = false, features = ["icon-iconify", "tailwind"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
