name: CI

# The Rust project lives in `todo-app/`.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: todo-app

      # The build script downloads the Tailwind CLI, so this job needs network access.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the release executable and its asset bundle, as a deployment would.
      - uses: docker/build-push-action@v7
        with:
          context: ./todo-app
          push: false
          tags: todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
