name: CI

# The Rust project lives in `todo-app/`.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    # The tests run against a real SQL Server. The password is the app's local-development
    # default (src/config.rs), so no further configuration is needed.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ToDoApp-Dev-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ToDoApp-Dev-Passw0rd -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: todo-app

      # The build script downloads the Tailwind CLI, so this job needs network access.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the release executable and its asset bundle, as a deployment would.
      - uses: docker/build-push-action@v7
        with:
          context: ./todo-app
          push: false
          tags: todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
